server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=expense-chain-backend
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Database Configuration (PostgreSQL / Supabase)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.liquibase.enabled=false

# Corda Nodes RPC Addresses

corda.nodes.Garvit.host=${CORDA_GARVIT_HOST:localhost}
corda.nodes.Garvit.rpcPort=${CORDA_GARVIT_RPC_PORT:10006}
corda.nodes.Garvit.username=${CORDA_RPC_USERNAME:user1}
corda.nodes.Garvit.password=${CORDA_RPC_PASSWORD:}
corda.nodes.Garvit.x500Name=${CORDA_GARVIT_X500:O=Garvit,L=New Delhi,C=IN}

corda.nodes.Arnav.host=${CORDA_ARNAV_HOST:localhost}
corda.nodes.Arnav.rpcPort=${CORDA_ARNAV_RPC_PORT:10009}
corda.nodes.Arnav.username=${CORDA_RPC_USERNAME:user1}
corda.nodes.Arnav.password=${CORDA_RPC_PASSWORD:}
corda.nodes.Arnav.x500Name=${CORDA_ARNAV_X500:O=Arnav,L=Mumbai,C=IN}

corda.nodes.Mridul.host=${CORDA_MRIDUL_HOST:localhost}
corda.nodes.Mridul.rpcPort=${CORDA_MRIDUL_RPC_PORT:10012}
corda.nodes.Mridul.username=${CORDA_RPC_USERNAME:user1}
corda.nodes.Mridul.password=${CORDA_RPC_PASSWORD:}
corda.nodes.Mridul.x500Name=${CORDA_MRIDUL_X500:O=Mridul,L=Bengaluru,C=IN}

corda.notary.x500Name=${CORDA_NOTARY_X500:O=Notary,L=London,C=GB}

# Email Provider Configuration (Gmail SMTP)
spring.mail.host=${EMAIL_HOST:${SMTP_HOST:smtp.gmail.com}}
spring.mail.port=${EMAIL_PORT:${SMTP_PORT:587}}
spring.mail.username=${EMAIL_USER:${SMTP_USERNAME:}}
spring.mail.password=${EMAIL_APP_PASSWORD:${SMTP_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=10000

email.from=${EMAIL_FROM:${EMAIL_USER:no-reply@expensechain.internal}}
email.mock.enabled=${EMAIL_MOCK_ENABLED:false}
